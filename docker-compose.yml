version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: giuaky-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: giuaky_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./giuaky/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build:
      context: ./giuaky/backend
      dockerfile: Dockerfile
    container_name: giuaky-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=giuaky_db
    depends_on:
      - db

  frontend:
    build:
      context: ./giuaky/frontend
      dockerfile: Dockerfile
    container_name: giuaky-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data: